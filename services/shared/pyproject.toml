[project]
name = "voice-agent-shared"
version = "0.1.0"
description = "Shared logging, models and telemetry for the multi-tenant AI voice agent platform"
requires-python = ">=3.11"
dependencies = [
    "prometheus-client>=0.22",  # livekit-agents 1.8 requires >=0.22; keep all three services aligned
    "cryptography>=44",         # Fernet, for credential encryption at rest
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The image runs as a non-root user and /opt/shared is not writable, so the
# cache provider would emit a permission warning on every run.
addopts = "-q --strict-markers -p no:cacheprovider"
