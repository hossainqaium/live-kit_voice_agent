[alembic]
script_location = alembic
prepend_sys_path = .
# Timestamped, sortable revision filenames: the migration order is readable
# from a directory listing without opening any file.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC
# sqlalchemy.url is intentionally absent. env.py reads the DSN from settings so
# there is exactly one source of connection configuration.

# No post-write hooks. Formatting generated revisions would mean shipping a
# linter inside the runtime image; `make fmt` covers them from the developer's
# own toolchain instead.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
