# Prometheus scrape configuration (spec 57).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: configuration-api
    metrics_path: /metrics
    static_configs:
      - targets: ["configuration-api:8000"]
        labels:
          plane: control

  - job_name: ai-agent-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-agent-worker:8090"]
        labels:
          plane: voice

  - job_name: livekit
    metrics_path: /metrics
    static_configs:
      - targets: ["livekit:6789"]
        labels:
          plane: voice

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
