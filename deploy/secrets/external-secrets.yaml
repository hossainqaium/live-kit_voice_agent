# External Secrets Operator (ESO) manifests for the voice agent platform.
#
# ESO syncs secrets from a secret backend (Vault, AWS Secrets Manager,
# GCP Secret Manager, Azure Key Vault, etc.) into Kubernetes Secrets.
# This keeps credentials out of Git, Helm values, and shell history.
#
# Install ESO:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm upgrade --install external-secrets external-secrets/external-secrets \
#     --namespace external-secrets-system --create-namespace
#
# Then choose ONE of the ClusterSecretStore blocks below for your backend,
# and apply this file:
#   kubectl apply -f deploy/secrets/external-secrets.yaml -n voice-agent

# =========================================================================== #
# OPTION A: HashiCorp Vault
# =========================================================================== #
---
# apiVersion: external-secrets.io/v1beta1
# kind: ClusterSecretStore
# metadata:
#   name: vault
# spec:
#   provider:
#     vault:
#       server: "https://vault.example.com"
#       path: "secret"
#       version: "v2"
#       auth:
#         kubernetes:
#           mountPath: "kubernetes"
#           role: "voice-agent"

# =========================================================================== #
# OPTION B: AWS Secrets Manager
# =========================================================================== #
# apiVersion: external-secrets.io/v1beta1
# kind: ClusterSecretStore
# metadata:
#   name: aws-secretsmanager
# spec:
#   provider:
#     aws:
#       service: SecretsManager
#       region: us-east-1
#       auth:
#         jwt:                       # Use IAM Roles for Service Accounts (IRSA)
#           serviceAccountRef:
#             name: voice-agent-platform
#             namespace: voice-agent

# =========================================================================== #
# OPTION C: GCP Secret Manager
# =========================================================================== #
# apiVersion: external-secrets.io/v1beta1
# kind: ClusterSecretStore
# metadata:
#   name: gcp-secretmanager
# spec:
#   provider:
#     gcpsm:
#       projectID: your-gcp-project-id
#       auth:
#         workloadIdentity:
#           clusterLocation: us-central1
#           clusterName: voice-agent-cluster
#           serviceAccountRef:
#             name: voice-agent-platform

# =========================================================================== #
# ExternalSecret — syncs all platform credentials into one Kubernetes Secret.
#
# Adjust the `remoteRef.key` values to match your secret backend's path/name.
# For Vault: secret/data/voice-agent/production
# For AWS:   arn:aws:secretsmanager:us-east-1:123456789:secret:voice-agent/production
# For GCP:   projects/your-project/secrets/voice-agent-production
# =========================================================================== #
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: voice-agent-platform-credentials
  namespace: voice-agent
spec:
  # Refresh interval — how often ESO re-reads the secret from the backend.
  # Short intervals increase API calls; long intervals delay rotation propagation.
  refreshInterval: 1h

  secretStoreRef:
    # Change to the name of whichever ClusterSecretStore you uncommented above.
    name: vault            # or aws-secretsmanager / gcp-secretmanager
    kind: ClusterSecretStore

  target:
    name: voice-agent-platform-credentials
    creationPolicy: Owner
    # Helm secret.yaml will detect this Secret exists and skip creating its own
    # when secrets.existingSecret is set to "voice-agent-platform-credentials".
    template:
      type: Opaque
      metadata:
        annotations:
          helm.sh/resource-policy: keep

  data:
    # Each entry pulls one key from the backend into the target Secret.
    - secretKey: jwtSecret
      remoteRef:
        key: voice-agent/production
        property: jwt_secret         # the JSON key inside the backend secret

    - secretKey: credentialEncryptionKey
      remoteRef:
        key: voice-agent/production
        property: credential_encryption_key

    - secretKey: postgresPassword
      remoteRef:
        key: voice-agent/production
        property: postgres_password

    - secretKey: livekitApiKey
      remoteRef:
        key: voice-agent/production
        property: livekit_api_key

    - secretKey: livekitApiSecret
      remoteRef:
        key: voice-agent/production
        property: livekit_api_secret

    - secretKey: minioRootUser
      remoteRef:
        key: voice-agent/production
        property: minio_root_user

    - secretKey: minioRootPassword
      remoteRef:
        key: voice-agent/production
        property: minio_root_password
