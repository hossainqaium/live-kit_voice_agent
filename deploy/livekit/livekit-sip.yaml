# LiveKit SIP — development configuration.
#
# Terminates SIP from the tenant's PBX and bridges it into a LiveKit room.
# Infrastructure-level and platform-controlled (spec 13).

api_key: devkey
api_secret: devsecret-at-least-32-characters-long
ws_url: ws://livekit:7880

redis:
  address: redis:6379

sip_port: 5060

# Narrow development RTP range, for the same Docker Desktop reason as the RTC
# range above. Roughly two ports per concurrent call, so this supports a small
# number of simultaneous calls — enough for Phase 1 and 2, widened for load
# testing in Phase 8.
rtp_port: 10100-10149

use_external_ip: false

logging:
  level: info
  json: true
