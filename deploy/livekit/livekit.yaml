# LiveKit Server — development configuration.
#
# Everything in this file is infrastructure-level and therefore platform/DevOps
# controlled (spec 13). It must never be exposed to tenant administrators.
# Tenant-level LiveKit configuration (SIP trunks, dispatch rules, agent
# dispatch) is created through the Configuration API instead.

port: 7880

rtc:
  # Must equal the published host port, because LiveKit advertises this number
  # in its ICE candidates. Published as 7881->7881 previously meant advertising
  # 7881 while the host listened on 7981, so every browser that fell back to
  # TCP dialled a closed port and the call failed with "negotiation timed out".
  #
  # The UDP range below has always been 1:1 for the same reason. Anything whose
  # number appears in a candidate has to match on both sides.
  tcp_port: 7981
  # One muxed UDP port rather than a range. A range was the obvious reading of
  # the spec's port-range requirement, and it made browser calls fail: every
  # port in it becomes a separate ICE candidate and a separate Docker Desktop
  # forwarding entry, and gathering across fifty of them took about 15 seconds.
  # livekit-client abandons negotiation at 10, so publishing a microphone
  # failed with "negotiation timed out" — a message that points at neither
  # ports nor Docker.
  #
  # Muxing is also what LiveKit recommends in production; the range was never
  # buying anything here. Keep it 1:1 with the published port, like tcp_port.
  udp_port: 50100
  # No STUN. Everything here — browser, worker, SIP, LiveKit — is on this
  # machine or its LAN, so a server-reflexive candidate is a round trip to the
  # public internet to learn an address nothing needs. LiveKit's default STUN
  # servers are Google's, and gathering against them was a large part of the
  # seven seconds a browser peer connection took to establish, which in turn is
  # what made renegotiation time out when the agent replied.
  #
  # A deployment whose clients are not on the LAN needs these back.
  stun_servers: []

  # No external IP discovery locally; the PBX and LiveKit share the bridge
  # network. A remote PBX needs use_external_ip: true and a reachable address.
  use_external_ip: false

redis:
  address: redis:6379

# No `keys:` block. The key pair arrives as the LIVEKIT_KEYS environment
# variable ("key: secret"), which compose builds from .env.
#
# It used to be written here as devkey/devsecret-at-least-32-characters-long —
# the pair from LiveKit's own examples, committed to this repository. Anyone
# who could reach port 7880 could mint a token for any room and join any call
# in progress, because the secret is the only thing a token is signed with.
# A file saying "development credentials only" does not stop that being true
# of whatever environment the file is deployed to (spec 54).

turn:
  enabled: false

# Scraped by Prometheus (spec 57).
prometheus:
  port: 6789

logging:
  level: info
  json: true
