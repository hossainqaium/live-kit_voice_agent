{{- if not .Values.secrets.existingSecret -}}
{{/*
  Only create the Secret when the caller has not brought their own.
  Required fields fail at render time (required "...").
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "voice-agent-platform.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "voice-agent-platform.labels" . | nindent 4 }}
  annotations:
    # Prevent Helm from showing this in plain-text diffs.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  jwtSecret: {{ required "secrets.jwtSecret must not be empty" .Values.secrets.jwtSecret | quote }}
  credentialEncryptionKey: {{ .Values.secrets.credentialEncryptionKey | default "" | quote }}
  postgresPassword: {{ required "secrets.postgresPassword must not be empty" .Values.secrets.postgresPassword | quote }}
  livekitApiKey: {{ required "secrets.livekitApiKey must not be empty" .Values.secrets.livekitApiKey | quote }}
  livekitApiSecret: {{ required "secrets.livekitApiSecret must not be empty" .Values.secrets.livekitApiSecret | quote }}
  minioRootUser: {{ .Values.secrets.minioRootUser | default "minioadmin" | quote }}
  minioRootPassword: {{ required "secrets.minioRootPassword must not be empty" .Values.secrets.minioRootPassword | quote }}
{{- end }}
