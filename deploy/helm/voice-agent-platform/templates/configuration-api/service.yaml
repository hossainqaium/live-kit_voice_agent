apiVersion: v1
kind: Service
metadata:
  name: {{ include "voice-agent-platform.fullname" . }}-configuration-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "voice-agent-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: configuration-api
spec:
  type: {{ .Values.configurationApi.service.type }}
  selector:
    {{- include "voice-agent-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: configuration-api
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.configurationApi.service.port }}
      targetPort: http
