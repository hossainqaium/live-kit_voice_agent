apiVersion: v1
kind: Service
metadata:
  name: {{ include "voice-agent-platform.fullname" . }}-ai-agent-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "voice-agent-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-agent-worker
spec:
  type: {{ .Values.aiAgentWorker.service.type }}
  selector:
    {{- include "voice-agent-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ai-agent-worker
  ports:
    - name: health
      protocol: TCP
      port: {{ .Values.aiAgentWorker.service.port }}
      targetPort: health
